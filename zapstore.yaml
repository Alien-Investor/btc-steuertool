name: BTC Steuertool
summary: Bitcoin tax reports for Germany (FiFo, § 23 EStG) — fully offline, no internet permission, no account.

description: |
  BTC Steuertool turns CSV exports from your BitBox wallets and brokers into annual tax reports for the German
  tax office (private sales under § 23 EStG). Everything is calculated on the device: no upload, no account,
  no tracking. The app has no INTERNET permission; the only permission in its manifest is the
  AndroidX-generated signature permission of the app itself, which grants nothing.

  Features:
  - FiFo method per wallet (German Federal Ministry of Finance letter of 06.03.2025, para. 62); the app treats every exchange account as
    a wallet of its own. On transfers between your own wallets, purchase date and cost travel along (the letter does not spell this out;
    the evidence document discloses the reading). One-year holding period counted by calendar date (§§ 187, 188 BGB), tax-free and taxable per lot
  - Transfers are matched automatically (transaction ID, otherwise amount and time); unmatched outgoing transfers are reported, never
    silently booked as sales. Internal wallet check report with real wallet names, never part of the documents for the tax office
  - Exemption limit applied automatically (600 EUR up to 2023, 1,000 EUR from 2024)
  - Supported sources: BitBox wallets, 21bitcoin, Bison, Swissquote, Strike, Pocket, Bisq 1 (German or English interface), plus manual
    buys/sells as CSV. Other exchanges via a CoinTracking or Blockpit export (every account in it becomes a wallet of its own; these
    formats are derived from the documentation and not yet confirmed against real exports, the report says so). Wallet exports
    from Sparrow, Electrum, Trezor Suite and Ledger Wallet (formerly Ledger Live): every wallet or Ledger account is a holding of its
    own; derived from the programs' source code and not yet confirmed against real exports, the report says so
  - Brokers are detected from the file contents; ZIP files are unpacked; files the app cannot recognise block the calculation
    instead of silently missing from the report. Every file is checked for its required columns before reading: a renamed column
    stops the run with file, line and column instead of silently dropping data; a byte-order mark (e.g. after saving in Excel) is read correctly
  - Network fees paid in bitcoin are treated as a disposal of the fee amount at the daily closing price; gifts and donations
    (marked in the BitBox note) leave your holdings without counting as a sale
  - noKYC purchases (Bisq, manual buys not marked as KYC, noKYC wallets) are kept strictly apart: separate FiFo pool and a separate internal
    report, never part of the documents for the tax office
  - Output: tax report, formal tax evidence document, buys/sells as CSV — saved through the Android save dialog
  - Bug report with an optional diagnosis: detected file types and the messages of the last calculation, without file names,
    amounts, exact dates, addresses or wallet names (years and line numbers remain); you see it in full before sending. The full
    log can be saved for yourself
  - ECB exchange rates (USD/CHF) and BTC daily closing prices are bundled; nothing is downloaded
  - Same calculation core as the open-source command-line tool and the web version (Python via Pyodide), reports byte-identical
  - Screenshots blocked (FLAG_SECURE), no backup of app data, offline in-app guide in German and English
  - Reports are in German (they are meant for the German tax office); the interface is German / English

  No tax advice: the app is a calculation aid, responsibility for the tax return stays with you. Open source (MIT).

