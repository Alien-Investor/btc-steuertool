<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b201a"/>
      <stop offset="60%" stop-color="#04100c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a28"/>
      <stop offset="100%" stop-color="#060e12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Sternchen -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="150" cy="190" r="3"/><circle cx="880" cy="170" r="3"/>
    <circle cx="130" cy="840" r="2"/><circle cx="900" cy="860" r="3"/>
  </g>

  <!-- Steuerbeleg: Blatt mit Eselsohr -->
  <g filter="url(#glow)" stroke="#00ffcc" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 160 H620 L760 300 V860 H300 Z" fill="url(#sheet)" stroke-width="22"/>
    <path d="M620 160 V300 H760" fill="none" stroke-width="18"/>
    <!-- Zeilen -->
    <g stroke-width="14" opacity="0.55" fill="none">
      <path d="M370 250 H540"/>
      <path d="M370 730 H690"/>
      <path d="M370 790 H600"/>
    </g>
  </g>

  <!-- Bitcoin-Zeichen -->
  <g filter="url(#glow)" fill="none" stroke="#00ffcc" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 380 V640"/>
    <path d="M440 380 H570 Q630 380 630 440 Q630 500 570 500 H440"/>
    <path d="M440 500 H585 Q650 500 650 570 Q650 640 585 640 H440"/>
    <path d="M500 340 V380 M560 340 V380 M500 640 V680 M560 640 V680"/>
  </g>
</svg>
